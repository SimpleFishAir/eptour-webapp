<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Baserow access check</title>
<style>
  :root {
    --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d8d2;
    --ok: #1f7a3a; --bad: #b3261e; --accent: #2b5fab; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --fg: #ecebe6; --muted: #a3a29c; --line: #3a3a37;
      --ok: #5cc07f; --bad: #f08a80; --accent: #8db4ef; --on-accent: #10233f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  label { display: block; margin-top: 18px; font-weight: 600; }
  input { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  button { margin-top: 22px; width: 100%; padding: 12px; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: 0.6; }
  .hint { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  #result { margin-top: 24px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); white-space: pre-wrap; display: none; }
  #result.ok { border-color: var(--ok); color: var(--ok); }
  #result.bad { border-color: var(--bad); color: var(--bad); }
  #result.wait { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Baserow access check</h1>
  <p class="hint">Checks that this page can read your Baserow table directly from the browser. The token is used for this one request, then cleared. It is not saved anywhere.</p>

  <form id="check" autocomplete="off">
    <label for="table">Table ID</label>
    <input id="table" inputmode="numeric" pattern="[0-9]+" required>
    <p class="hint">The number after /table/ in the table's web address in Baserow.</p>

    <label for="token">Read-only database token</label>
    <input id="token" type="password" required autocomplete="off" spellcheck="false" autocapitalize="off">

    <button id="go" type="submit">Check access</button>
  </form>

  <div id="result" role="status" aria-live="polite"></div>
</main>

<script>
  (function () {
    var API = 'https://api.baserow.io';
    var form = document.getElementById('check');
    var out = document.getElementById('result');
    var button = document.getElementById('go');
    var tokenInput = document.getElementById('token');

    // All output goes through textContent, never innerHTML.
    function show(text, kind) {
      out.textContent = text;
      out.className = kind;
      out.style.display = 'block';
    }

    // Only show Baserow error codes that look like codes, nothing else from the reply.
    function errorCode(body) {
      if (body && typeof body.error === 'string' && /^[A-Z_]{1,64}$/.test(body.error)) {
        return ' (' + body.error + ')';
      }
      return '';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var tableId = document.getElementById('table').value.trim();
      var token = tokenInput.value.trim();

      if (!/^\d+$/.test(tableId)) {
        show('The table ID should be a number only.', 'bad');
        return;
      }

      button.disabled = true;
      show('Checking…', 'wait');

      var res;
      try {
        res = await fetch(API + '/api/database/rows/table/' + tableId + '/?user_field_names=true&size=1', {
          method: 'GET',
          headers: { 'Authorization': 'Token ' + token },
          credentials: 'omit',
          cache: 'no-store',
          referrerPolicy: 'no-referrer'
        });
      } catch (err) {
        show('Blocked: the browser could not read Baserow from this page.\n\nEither Baserow does not accept requests from this site, or there is no connection. Check you are online and try once more. If it still fails, tell Claude "blocked".', 'bad');
        return;
      } finally {
        token = '';
        tokenInput.value = '';
        button.disabled = false;
      }

      var body = null;
      try { body = await res.json(); } catch (ignore) { body = null; }

      if (res.status === 401 || res.status === 403) {
        show('Browser access works, but the token was refused' + errorCode(body) + '.\n\nCheck the whole token was copied and that it has read access to this table. Tell Claude "browser OK, token refused".', 'bad');
        return;
      }
      if (res.status === 404) {
        show('Browser access works, but no table was found with that ID' + errorCode(body) + '.\n\nCheck the number after /table/ in the address. Tell Claude "browser OK, table not found".', 'bad');
        return;
      }
      if (!res.ok || !body) {
        show('Browser access works, but Baserow returned an error (' + res.status + ')' + errorCode(body) + '.\n\nTell Claude the number in brackets.', 'bad');
        return;
      }

      var count = typeof body.count === 'number' ? body.count : '?';
      var first = Array.isArray(body.results) && body.results.length ? body.results[0] : null;
      var fields = first ? Object.keys(first).filter(function (k) { return k !== 'id' && k !== 'order'; }) : [];

      show('Success: this page can read your table.\n\nRows: ' + count + '\nFields: ' + (fields.length ? fields.join(', ') : '(table is empty)') + '\n\nTell Claude "success".', 'ok');
    });
  })();
</script>
</body>
</html>
