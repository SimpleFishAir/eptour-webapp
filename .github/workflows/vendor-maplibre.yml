# Fetches the MapLibre map library from the official npm registry,
# checks it against the registry's published fingerprint, and commits
# the browser library, its style file, the licence and a fingerprint
# record to vendor/ on the vendor-maplibre branch (never dev or main).
# File locations are read from the package's own package.json.
# The fingerprint record also lists the names and sizes of the files in
# the package's dist/ folder, so companion files can be identified
# without opening the library. Names with unusual characters are not shown.
# Started only by hand. BL reviews and merges the branch into dev.
name: Vendor MapLibre

on:
  workflow_dispatch:
    inputs:
      version:
        description: "maplibre-gl version: 'latest' or an exact version such as 5.6.0"
        required: true
        default: "latest"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: repo

      - name: Fetch and check maplibre-gl
        id: fetch
        env:
          REQUESTED: ${{ inputs.version }}
          REGISTRY: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          fail() { echo "ERROR: $1"; exit 1; }

          [[ "$REQUESTED" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]] || fail "version must be 'latest' or an exact version such as 5.6.0"

          WORK="$RUNNER_TEMP/work"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$WORK" "$OUT"
          cd "$WORK"

          VERSION="$(npm view "maplibre-gl@${REQUESTED}" version --registry="$REGISTRY" 2>/dev/null)" || fail "could not look up the version"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "could not resolve a single exact version"

          INTEGRITY="$(npm view "maplibre-gl@${VERSION}" dist.integrity --registry="$REGISTRY" 2>/dev/null)" || fail "could not look up the registry fingerprint"
          [[ "$INTEGRITY" =~ ^sha512-[A-Za-z0-9+/=]+$ ]] || fail "registry did not publish a sha512 fingerprint"

          npm pack "maplibre-gl@${VERSION}" --ignore-scripts --registry="$REGISTRY" >/dev/null 2>&1 || fail "download failed"
          TARBALL="maplibre-gl-${VERSION}.tgz"
          [ -f "$TARBALL" ] || fail "downloaded archive not found"

          ACTUAL="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)" || fail "could not compute the archive fingerprint"
          [ "$ACTUAL" = "$INTEGRITY" ] || fail "archive fingerprint does not match the registry"

          tar -xzf "$TARBALL" package/package.json >/dev/null 2>&1 || fail "package.json not found in the package"

          PATHS="$(node -e '
            const p = require("./package/package.json");
            const strip = s => (typeof s === "string" ? s.replace(/^\.\//, "") : null);
            const dot = p.exports && typeof p.exports === "object" ? p.exports["."] : null;
            const fromDot = k => (dot && typeof dot === "object" ? strip(dot[k]) : null);
            const jsCandidates = [
              strip(p.jsdelivr), strip(p.unpkg), strip(p.browser),
              typeof dot === "string" ? strip(dot) : null,
              fromDot("browser"), fromDot("import"), fromDot("default"), strip(p.main)
            ];
            const js = jsCandidates.find(s => s && /^dist\/[A-Za-z0-9._-]+\.(js|mjs)$/.test(s));
            const cssCandidates = [strip(p.style), "dist/maplibre-gl.css"];
            const css = cssCandidates.find(s => s && /^dist\/[A-Za-z0-9._-]+\.css$/.test(s));
            if (!js || !css) process.exit(3);
            process.stdout.write(js + "\n" + css + "\n");
          ' 2>/dev/null)" || fail "package.json does not name a usable browser library and style file"

          JS_PATH="$(printf '%s\n' "$PATHS" | sed -n 1p)"
          CSS_PATH="$(printf '%s\n' "$PATHS" | sed -n 2p)"
          [[ "$JS_PATH" =~ ^dist/[A-Za-z0-9._-]+\.(js|mjs)$ ]] || fail "library path failed the safety check"
          [[ "$CSS_PATH" =~ ^dist/[A-Za-z0-9._-]+\.css$ ]] || fail "style path failed the safety check"

          tar -xzf "$TARBALL" "package/$JS_PATH" "package/$CSS_PATH" >/dev/null 2>&1 || fail "library or style file not found in the package"
          tar -xzf "$TARBALL" --wildcards 'package/LICENSE*' >/dev/null 2>&1 || true
          LICENCE_FILE="$(ls package/LICENSE* 2>/dev/null | head -1 || true)"
          [ -n "$LICENCE_FILE" ] || fail "licence file not found in the package"

          # Names and sizes of the files in dist/, for the fingerprint record.
          # Only names made of letters, digits, dots, dashes, underscores and
          # slashes are shown; others are counted but not shown.
          MEMBERS="$(tar -tzf "$TARBALL")" || fail "could not list the package"
          LISTING="$WORK/dist-listing.txt"
          : > "$LISTING"
          HIDDEN=0
          while IFS= read -r m; do
            case "$m" in package/dist/*) ;; *) continue ;; esac
            n="${m#package/dist/}"
            [ -n "$n" ] || continue
            case "$n" in */) continue ;; esac
            if [[ "$n" =~ ^[A-Za-z0-9._/-]{1,120}$ ]] && [[ "$n" != *..* ]]; then
              SIZE="$(tar -xOzf "$TARBALL" "$m" | wc -c)" || fail "could not read a file size"
              echo "  dist/${n} bytes=${SIZE}" >> "$LISTING"
            else
              HIDDEN=$((HIDDEN + 1))
            fi
          done <<< "$MEMBERS"
          sort -o "$LISTING" "$LISTING"
          [ "$HIDDEN" -eq 0 ] || echo "  ${HIDDEN} file(s) with unusual names not shown" >> "$LISTING"

          JS_NAME="$(basename "$JS_PATH")"
          CSS_NAME="$(basename "$CSS_PATH")"
          cp "package/$JS_PATH" "$OUT/$JS_NAME" || fail "could not copy the library"
          cp "package/$CSS_PATH" "$OUT/$CSS_NAME" || fail "could not copy the style file"
          cp "$LICENCE_FILE" "$OUT/LICENSE-maplibre-gl.txt" || fail "could not copy the licence"
          cd "$OUT"

          {
            echo "package: maplibre-gl"
            echo "version: ${VERSION}"
            echo "archive_integrity: ${INTEGRITY}"
            echo "library: ${JS_NAME}"
            echo "style: ${CSS_NAME}"
            for f in "$JS_NAME" "$CSS_NAME" LICENSE-maplibre-gl.txt; do
              echo "${f} sha256=$(sha256sum "$f" | cut -d' ' -f1) sha384=sha384-$(openssl dgst -sha384 -binary "$f" | base64 -w0) bytes=$(stat -c %s "$f")"
            done
            echo "dist files in the package (names and sizes only; only the files above are kept):"
            cat "$LISTING"
          } > CHECKSUMS-maplibre-gl.txt || fail "could not write the fingerprint record"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "integrity=${INTEGRITY}" >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION}"
          echo "Archive fingerprint matches the registry: ${INTEGRITY}"
          echo "Library: ${JS_NAME}"
          echo "Style: ${CSS_NAME}"
          grep ' sha256=' CHECKSUMS-maplibre-gl.txt

      - name: Commit to the vendor-maplibre branch
        working-directory: repo
        env:
          BRANCH: vendor-maplibre
          VERSION: ${{ steps.fetch.outputs.version }}
          INTEGRITY: ${{ steps.fetch.outputs.integrity }}
        run: |
          set -euo pipefail
          fail() { echo "ERROR: $1"; exit 1; }

          [ "$BRANCH" = "vendor-maplibre" ] || fail "unexpected branch name"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "missing version from the previous step"

          git switch -q -C "$BRANCH" || fail "could not start the branch"
          mkdir -p vendor
          rm -f vendor/maplibre-gl.* vendor/LICENSE-maplibre-gl.txt vendor/CHECKSUMS-maplibre-gl.txt
          cp "$RUNNER_TEMP/out/"* vendor/ || fail "could not place the files in vendor/"
          git add vendor || fail "could not stage the files"

          if git diff --cached --quiet; then
            echo "dev already has these exact files; nothing to commit"
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Add MapLibre ${VERSION} to vendor/" \
              -m "Fetched from the official npm registry and checked against its published fingerprint (${INTEGRITY})." \
            || fail "could not commit"

          git push -q --force origin "HEAD:refs/heads/${BRANCH}" || fail "could not push the branch"
          echo "Pushed MapLibre ${VERSION} to the ${BRANCH} branch"
