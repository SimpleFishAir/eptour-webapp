# Builds the base map files from Natural Earth (public domain) and commits
# them to map/ on the basemap branch (never dev or main), only if the
# checking script passes.
#
# Three jobs:
#   build   read-only. Downloads Natural Earth and runs tools/build_basemap.py.
#   check   read-only. Runs tools/check_basemap.py on the build's output.
#   commit  runs the check again, then commits to the basemap branch only,
#           using GitHub's built-in temporary key. No other secrets are used.
#
# Sources are fixed below. On the first run they are empty: the newest
# Natural Earth release and the relief download's fingerprint are used and
# recorded in map/MANIFEST-basemap.txt, then fixed here.
# Started only by hand. BL reviews and merges the branch into dev.
# Logs show fixed messages and counts only.
name: Build Base Map

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NE_VECTOR_REPO: https://github.com/nvkelso/natural-earth-vector
  NE_VECTOR_COMMIT: ""
  RELIEF_URL: https://naciscdn.org/naturalearth/10m/raster/SR_HR.zip
  RELIEF_SHA256: ""
  PILLOW_VERSION: "12.3.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: repo
          persist-credentials: false

      - name: Download Natural Earth
        id: sources
        run: |
          set -euo pipefail
          fail() { echo "ERROR: $1"; exit 1; }
          SRC="$RUNNER_TEMP/src"
          mkdir -p "$SRC"
          get() { curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 --max-filesize "$3" -o "$1" "$2"; }

          TAGS="$(git ls-remote --tags "$NE_VECTOR_REPO" 2>/dev/null)" || fail "could not list Natural Earth releases"
          if [ -n "$NE_VECTOR_COMMIT" ]; then
            [[ "$NE_VECTOR_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "the fixed commit is not in the expected form"
            COMMIT="$NE_VECTOR_COMMIT"
            TAG="none"
            while read -r sha ref; do
              [ "$sha" = "$COMMIT" ] || continue
              ref="${ref%"^{}"}"
              if [[ "$ref" =~ ^refs/tags/(v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})$ ]]; then
                TAG="${BASH_REMATCH[1]}"
                break
              fi
            done <<< "$TAGS"
          else
            TAG="$(printf '%s\n' "$TAGS" | awk '{ print $2 }' \
              | { grep -E '^refs/tags/v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$' || true; } \
              | sed 's#^refs/tags/##' | sort -V | tail -n 1)"
            [ -n "$TAG" ] || fail "no Natural Earth release found"
            COMMIT="$(printf '%s\n' "$TAGS" | awk -v r="refs/tags/${TAG}^{}" '$2 == r { print $1 }')"
            [ -n "$COMMIT" ] || COMMIT="$(printf '%s\n' "$TAGS" | awk -v r="refs/tags/${TAG}" '$2 == r { print $1 }')"
          fi
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "could not find the release's commit"

          for n in ne_10m_land ne_10m_ocean ne_10m_lakes ne_10m_lakes_europe \
                   ne_10m_rivers_lake_centerlines ne_10m_rivers_europe ne_10m_admin_0_boundary_lines_land; do
            get "$SRC/$n.geojson" "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/${COMMIT}/geojson/${n}.geojson" 300000000 \
              || fail "could not download ${n}"
          done

          get "$SRC/relief.zip" "$RELIEF_URL" 1500000000 || fail "could not download the relief image"
          RELIEF_ACTUAL="$(sha256sum "$SRC/relief.zip" | cut -d' ' -f1)"
          if [ -n "$RELIEF_SHA256" ]; then
            [ "$RELIEF_ACTUAL" = "$RELIEF_SHA256" ] || fail "the relief download does not match its fixed fingerprint"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "relief_sha256=${RELIEF_ACTUAL}" >> "$GITHUB_OUTPUT"
          echo "Natural Earth release: ${TAG} (${COMMIT})"
          echo "Relief download fingerprint: ${RELIEF_ACTUAL}"

      - name: Install the image library
        run: |
          set -euo pipefail
          fail() { echo "ERROR: $1"; exit 1; }
          [[ "$PILLOW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "image library version is not in the expected form"
          python3 -m venv "$RUNNER_TEMP/venv" || fail "could not set up Python"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check --no-input --only-binary=:all: \
            "Pillow==${PILLOW_VERSION}" >/dev/null 2>&1 || fail "could not install the image library"
          echo "Image library: Pillow ${PILLOW_VERSION}"

      - name: Build the map files
        env:
          TAG: ${{ steps.sources.outputs.tag }}
          COMMIT: ${{ steps.sources.outputs.commit }}
          RELIEF_ACTUAL: ${{ steps.sources.outputs.relief_sha256 }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -I repo/tools/build_basemap.py \
            --src "$RUNNER_TEMP/src" \
            --relief-zip "$RUNNER_TEMP/src/relief.zip" \
            --out "$RUNNER_TEMP/map-out" \
            --ne-tag "$TAG" \
            --ne-commit "$COMMIT" \
            --relief-sha256 "$RELIEF_ACTUAL" \
            --pillow "$PILLOW_VERSION"

      - name: Hand the files to the check job
        uses: actions/upload-artifact@v4
        with:
          name: basemap
          path: ${{ runner.temp }}/map-out/
          retention-days: 3
          if-no-files-found: error

  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: repo
          persist-credentials: false

      - name: Fetch the build's files
        uses: actions/download-artifact@v4
        with:
          name: basemap
          path: ${{ runner.temp }}/map-out

      - name: Check the files
        run: python3 -I repo/tools/check_basemap.py "$RUNNER_TEMP/map-out"

  commit:
    needs: [build, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: repo

      - name: Fetch the build's files
        uses: actions/download-artifact@v4
        with:
          name: basemap
          path: ${{ runner.temp }}/map-out

      - name: Check the files again
        run: python3 -I repo/tools/check_basemap.py "$RUNNER_TEMP/map-out"

      - name: Commit to the basemap branch
        working-directory: repo
        env:
          BRANCH: basemap
        run: |
          set -euo pipefail
          fail() { echo "ERROR: $1"; exit 1; }
          [ "$BRANCH" = "basemap" ] || fail "unexpected branch name"

          git switch -q -C "$BRANCH" || fail "could not start the branch"
          rm -rf map
          mkdir map
          cp "$RUNNER_TEMP/map-out/"* map/ || fail "could not place the files in map/"
          git add -A map || fail "could not stage the files"

          if git diff --cached --quiet; then
            echo "dev already has these exact files; nothing to commit"
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Add base map files from Natural Earth" \
              -m "Built and checked by the Build Base Map workflow. Sources and fingerprints are in map/MANIFEST-basemap.txt." \
            || fail "could not commit"

          git push -q --force origin "HEAD:refs/heads/${BRANCH}" || fail "could not push the branch"
          echo "Pushed the base map files to the ${BRANCH} branch"
